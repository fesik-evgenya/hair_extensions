<body>
<div id="header-container">
    <div class="loading-spinner"></div>
</div>

<!-- Фоновые волны -->
<div class="wave-background">

    <img src="images/Wave_bottom.svg" alt="Волны" class="wave-middle">
    <img src="images/Wave_bottom.svg" alt="Волны" class="wave-bottom">
</div>

<div class="main__content">
    <h1 class="page-title">Мои контакты</h1>
    <div class="content-wrapper">

        <!-- Блок контактной информации -->
        <div class="contacts-block">
            <div class="contact-item">
                <img src="images/icon-home.svg" alt="Адрес" class="icon">
                <p class="contact-text" data-admin-field="address">г. Ростов-на-Дону, Нахичевань,<br> 30-я Линия
                    д.6</p>
            </div>

            <div class="contact-item">
                <img src="images/icon_email.svg" alt="Email" class="icon">
                <a href="mailto:my-longhair@mail.ru" class="contact-link"
                   data-admin-field="email">my-longhair@mail.ru</a>
            </div>

            <div class="contact-item">
                <img src="images/icon_phone.svg" alt="Телефон" class="icon">
                <a href="tel:+79913676565" class="contact-link" data-admin-field="phone">+7 (991) 367-65-65</a>
            </div>

            <div class="contact-item">
                <img src="images/icon_VK.svg" alt="Vkontante" class="icon">
                <a href="https://vk.com/narashchivanie_rostov" class="contact-link" data-admin-field="vk_link">Группа в VK</a>
            </div>
        </div>

        <!-- Блок с картой -->
        <div class="map-container" id="map"></div>
    </div>
    <!-- Форма обратной связи -->
    <form class="contact-form" id="myForm">
        <h2 class="form-title">Напишите мне</h2>

        <div class="form-group">
            <input type="text" name="name" placeholder="Ваше имя" required>
        </div>

        <div class="form-group">
            <input type="email" name="email" placeholder="Ваш email" required>
        </div>

        <div class="form-group">
            <textarea name="message" placeholder="Ваше сообщение" rows="4" required></textarea>
        </div>
        <div class="form-button-container">
            <button type="submit" class="submit-btn">Отправить сообщение</button>
        </div>
    </form>
</div>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>
    emailjs.init('Igz9AEDR5UaDNJd-A');

    document.getElementById('myForm').addEventListener('submit', function(e) {
        e.preventDefault();

        if(!this.email.value) {
            alert('Пожалуйста, введите email');
            return;
        }

        const params = {
            from_name: this.name.value,
            client_email: this.email.value, // Важно: имя поля формы
            message: this.message.value
        };

        console.log('Отправляемые параметры:', params); // Для отладки

        emailjs.send("service_gw5kffp", "template_ymqrp3q", params)
            .then(() => {
                alert('Сообщение отправлено!');
                this.reset();
            })
            .catch((error) => {
                console.error('Ошибка:', error);
                alert('Ошибка: ' + (error.text || error.message));
            });
    });
</script>

<script>
    <!-- Инициализация Яндекс.Карты -->
    ymaps.ready(init);

    function init() {
        const myMap = new ymaps.Map("map", {
            center: [47.223923, 39.723442], // Координаты адреса
            zoom: 16
        });

        myMap.geoObjects.add(new ymaps.Placemark(
            [47.223923, 39.723442],
            {balloonContent: 'Принимаю здесь'},
            {preset: 'islands#icon', iconColor: '#2d3e50'}
        ));
    }
</script>
