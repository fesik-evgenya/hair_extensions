<body>
<div id="header-container">

</div>

<main class="main">
    <!-- Волны фона -->
    <div class="wave-background">
        <img src="./assets/images/backgrounds/Wave_up.svg" alt="" class="wave-background__top" loading="lazy">
        <img src="./assets/images/backgrounds/Wave_bottom.svg" alt="" class="wave-background__middle" loading="lazy">
        <img src="./assets/images/backgrounds/Wave_bottom.svg" alt="" class="wave-background__bottom" loading="lazy">
    </div>

    <div class="main__content">
        <h1 class="page-title" data-admin-field="page_title">Мои контакты</h1>

        <div class="contacts-grid">

            <!-- Контактная информация -->
            <div class="contacts-block">

                <div class="contact-item">
                    <img src="./assets/images/icons/icon-home.svg" alt="Адрес" class="contact-item__icon">
                    <p class="contact-item__text" data-admin-field="address">г. Ростов-на-Дону, Нахичевань, 30-я Линия
                        д.6</p>
                </div>

                <div class="contact-item">
                    <img src="./assets/images/icons/icon_email.svg" alt="Email" class="contact-item__icon">
                    <a href="mailto:my-longhair@mail.ru" class="contact-link" data-admin-field="email">my-longhair@mail.ru</a>
                </div>

                <div class="contact-item">
                    <img src="./assets/images/icons/icon_phone.svg" alt="Телефон" class="contact-item__icon">
                    <a href="tel:+79913676565" class="contact-link" data-admin-field="phone">+7 (991) 367-65-65</a>
                </div>

                <div class="contact-item">
                    <img src="./assets/images/icons/icon_VK.svg" alt="Vkontante" class="contact-item__icon">
                    <a href="https://vk.com/narashchivanie_rostov" class="contact-link" data-admin-field="vk_link">Группа
                        в VK</a>
                </div>
            </div>

            <!-- Блок с картой -->
            <div class="map-container" id="map"></div>
        </div>

        <!-- Форма обратной связи -->
        <form class="contact-form" id="myForm">
            <h2 class="form-title">Напишите мне</h2>

            <div class="form-group">
                <input type="text" name="name" placeholder="Ваше имя" required>
            </div>

            <div class="form-group">
                <input type="email" name="email" placeholder="Ваш email" required>
            </div>

            <div class="form-group">
                <textarea name="message" placeholder="Ваше сообщение" rows="4" required></textarea>
            </div>
            <div class="form-button-container">
                <button type="submit" class="submit-btn">Отправить сообщение</button>
            </div>
        </form>
    </div>

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        emailjs.init('Igz9AEDR5UaDNJd-A');

        document.getElementById('myForm').addEventListener('submit', function (e) {
            e.preventDefault();

            if (!this.email.value) {
                alert('Пожалуйста, введите email');
                return;
            }

            const params = {
                from_name: this.name.value,
                client_email: this.email.value, // Важно: имя поля формы
                message: this.message.value
            };

            console.log('Отправляемые параметры:', params); // Для отладки

            emailjs.send("service_gw5kffp", "template_ymqrp3q", params)
                .then(() => {
                    alert('Сообщение отправлено!');
                    this.reset();
                })
                .catch((error) => {
                    console.error('Ошибка:', error);
                    alert('Ошибка: ' + (error.text || error.message));
                });
        });
    </script>

    <script>

                zoom: 16

            const myPlacemark = new ymaps.Placemark(
                [47.232414, 39.767951],
                {balloonContent: 'Принимаю здесь'},
                {
                    // Кастомная иконка метки в золотом стиле
                    iconLayout: 'default#image',
                    iconImageHref: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48Y2lyY2xlIGN4PSIyNTYiIGN5PSIyNTYiIHI9IjI1NiIgZmlsbD0iI0MwQTA0MCIgb3BhY2l0eT0iMC45Ii8+PGNpcmNsZSBjeD0iMjU2IiBjeT0iMjU2IiByPSIxODAiIGZpbGw9IiNGRkYiLz48Y2lyY2xlIGN4PSIyNTYiIGN5PSIyNTYiIHI9IjEyMCIgZmlsbD0iI0MwQTA0MCIvPjwvc3ZnPg==',
                    iconImageSize: [40, 40],
                    iconImageOffset: [-20, -20]
                }
            );

            myMap.geoObjects.add(myPlacemark);

            // Добавляем элементы управления
            myMap.controls.add('zoomControl', {
                position: {right: 10, top: 100}
            });
        }
    </script>
